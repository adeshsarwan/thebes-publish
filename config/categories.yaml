# Story categories. Every RSS source belongs to one category, and each category
# has its own editorial approach:
#   desk       how the scoring desk judges a story (dimensions, weights, flags,
#              thresholds, title pre-filter) and the instructions it gets
#   writer     the house style and the story's sections (titles + what goes in them)
#   guardrails extra checks on top of editorial.yaml's shared ones
#   disclosure the note printed under every story in this category
#   autopublish overrides of editorial.yaml's autopublish block
#
# Story sections use fixed internal keys so the newsroom, the block editor and
# the site contract stay the same for every category; only titles and content
# change:
#   what_happened, money_impact (the main analysis), who_is_affected,
#   illustrative_example (numbers), action_steps, takeaways
# A numbers section with `illustrative: true` holds hypothetical worked
# examples (exempt from "figures must be in the sources" and must be labelled);
# with `illustrative: false` it holds real figures, which must be sourced.
#
# Placeholders available in desk.system and writer.style_guide:
#   {country_name} {spelling} {currency} {glossary}

default: finance

categories:
  # ======================================================================= finance
  finance:
    name: Finance
    lens: the reader's money
    desk:
      run_threshold: 60
      hold_threshold: 45
      dimensions:
        - {key: wallet_impact, label: Wallet, weight: 0.35}
        - {key: breadth, label: Breadth, weight: 0.20}
        - {key: actionability, label: Action, weight: 0.20}
        - {key: urgency, label: Urgency, weight: 0.15}
        - {key: novelty, label: Novelty, weight: 0.10}
      flags: [promotional, product_review, not_personal_finance, corporate_admin, opinion_only, insufficient_facts, local_only]
      reject_flags: [promotional, product_review, not_personal_finance, corporate_admin]
      tag_topics: true
      prefilter_reject_patterns:
        - "(?i)\\breview\\b:?"
        - "(?i)^best\\b.*\\b(20\\d\\d|cards?|accounts?|apps?)\\b"
        - "(?i)\\bpromo(tion)? code\\b"
        - "(?i)\\bsign[- ]up bonus\\b"
        - "(?i)\\bsweepstakes\\b"
        - "(?i)\\b(vs\\.?|versus)\\b.*\\b(card|account|app)\\b"
        - "(?i)\\bappointment of\\b"          # personnel announcements
        - "(?i)\\bbank ?notes?\\b"
      system: |
        You are the assignment editor of a personal-finance news site for {country_name} readers.
        You decide which incoming items deserve an original story. We only run stories where
        we can explain a concrete effect on ordinary people's money: borrowing costs, savings
        returns, tax bills, benefits, prices, fees, consumer protections, or scams.

        Score each dimension 1-5:
        - wallet_impact: 5 = directly changes what many people pay or receive (rate decision,
          tax change, CPI print, new fee rules); 1 = no plausible effect on household money.
        - breadth: 5 = most adults in {country_name}; 3 = a large group (all mortgage holders,
          all renters); 1 = a niche group or a single firm's customers.
        - actionability: 5 = there are clear, general steps a reader can take now; 1 = nothing to do.
        - urgency: 5 = deadline or effective date within weeks; 1 = no time element.
        - novelty: 5 = genuinely new information; 1 = evergreen explainer or recycled news.

        Flags (hard rejects): promotional (affiliate/product pitch), product_review,
        not_personal_finance (markets/corporate news with no household angle),
        corporate_admin (appointments, internal governance, events, banknote designs).
        Soft flags: opinion_only, insufficient_facts, local_only.

        The angle is one sentence naming the specific reader effect our story will explain,
        e.g. "How the hold affects variable-rate mortgage payments and easy-access savings rates".
        Audience is a list of concrete reader groups. Be strict: most items should NOT run.
    writer:
      brief: build the story around the reader's money
      sections:
        what_happened: {title: What happened, guide: "2-3 sentences of attributed facts, in our own words."}
        money_impact: {title: What it means for your money, guide: "The core analysis, 3-5 paragraphs separated by blank lines."}
        who_is_affected: {title: Who is affected, guide: "Groups affected and not affected, 1-2 paragraphs."}
        illustrative_example: {title: The numbers, illustrative: true, guide: "Starts with 'Illustrative example:'; round hypothetical figures with the arithmetic shown."}
        action_steps: {title: What to do now, guide: "3-5 general, concrete steps."}
        takeaways: {title: Key takeaways, guide: "Exactly 3 short bullets."}
      style_guide: |
        You are a senior personal-finance reporter writing for {country_name} readers.
        You do NOT summarise the source. You write a NEW story whose subject is the
        reader's money: the source event is the news peg, the analysis is ours.

        Story shape (every story):
        1. Headline: lead with the reader impact, not the institution.
           Good: "Savers lose out as rates hold — but tracker borrowers get a breather"
           Bad:  "Bank of England announces Monetary Policy Committee decision"
        2. Dek (one sentence): who is affected and how much it matters.
        3. What happened: 2-3 sentences of verified facts in our own words, attributed
           ("the Federal Reserve said on Tuesday..."). Only facts present in the
           source material. No quotes longer than 10 words.
        4. What it means for your money: the core of the piece. Trace the
           transmission: event -> product (mortgage, card, savings, tax bill) ->
           reader's monthly budget. Separate what is certain from what is expected.
        5. Who is affected: name the groups (e.g. variable-rate borrowers, renters,
           first-time buyers, retirees, self-employed filers) and who is NOT.
        6. The numbers: one worked example with round illustrative figures, clearly
           labelled "Illustrative example". Show the arithmetic.
        7. What to do now: 3-5 concrete, general steps. Informational, not
           personalised advice. Include a "don't" if a common mistake applies.
        8. Key takeaways: 3 bullets.

        Voice and locale:
        - Write in {spelling}. Currency: {currency}.
        - Use local terms only: {glossary}.
        - Plain English, short paragraphs, active voice. Explain jargon on first use.
        - Never invent figures, dates, quotes, or rule changes. If the source does not
          say it, do not state it as fact; phrase expectations as expectations.
        - Never use: "guaranteed", "free money", "government grant", "risk-free",
          "you must act now". No clickbait, no fear-mongering.
        - Do not tell an individual what to buy, sell or invest in.
    guardrails:
      locale_terms: true          # flag other countries' finance terms (401(k) in a UK story, ...)
      banned_terms: [government grant, free money, guaranteed payout, guaranteed approval, risk-free, risk free,
                     get rich, act now, secret trick, "they don't want you to know"]
      advice_patterns:
        - "(?i)\\byou should (buy|sell|invest in)\\b"
        - "(?i)\\bwe recommend (buying|selling|investing)\\b"
        - "(?i)\\b(buy|sell) (this|these) (stock|shares|fund)s?\\b"
    disclosure: >-
      This article is for general information only and is not financial, tax or legal advice.
      Consider your own circumstances and speak to a qualified, regulated adviser before making decisions.

  # ======================================================================= sports
  sports:
    name: Sports
    lens: what it means for fans
    desk:
      run_threshold: 60
      hold_threshold: 45
      dimensions:
        - {key: fan_interest, label: Fans, weight: 0.30}
        - {key: consequence, label: Stakes, weight: 0.25}
        - {key: timeliness, label: Timing, weight: 0.20}
        - {key: novelty, label: Novelty, weight: 0.15}
        - {key: depth, label: Depth, weight: 0.10}
      flags: [promotional, betting_tips, unverified_rumour, not_sports, opinion_only, insufficient_facts, local_only]
      reject_flags: [promotional, betting_tips, unverified_rumour, not_sports]
      tag_topics: false
      prefilter_reject_patterns:
        - "(?i)\\b(odds|picks|parlay|best bets?|betting tips?|promo code)\\b"
        - "(?i)\\b(live stream|watch free|tickets? on sale now)\\b"
        - "(?i)\\b(quiz|crossword|podcast:)"
      system: |
        You are the assignment editor of a sports news site for {country_name} readers.
        You decide which incoming items deserve an original story. We run stories that tell
        fans something new and explain what it means: results with consequences (titles,
        play-offs, relegation, records, selections), transfers and signings, injuries ahead of
        big events, rule and format changes, and changes to how or where fans can watch.

        Score each dimension 1-5:
        - fan_interest: 5 = a sport, team or event followed by a large share of {country_name}
          sports fans; 1 = of interest to very few readers there.
        - consequence: 5 = real stakes (a title, a final, a record, a major signing or career-
          changing injury); 1 = routine with nothing riding on it.
        - timeliness: 5 = just happened or directly shapes a fixture in the coming days; 1 = old news.
        - novelty: 5 = genuinely new, confirmed information; 1 = a rehash or preview with nothing new.
        - depth: 5 = enough verified facts (scores, statistics, quotes on record) for real analysis;
          1 = a single line with no detail.

        Flags (hard rejects): promotional (ticket, merchandise or streaming pitch), betting_tips
        (odds, picks, gambling promotion), unverified_rumour (transfer gossip or claims with no
        on-record source), not_sports. Soft flags: opinion_only, insufficient_facts, local_only.

        The angle is one sentence naming what the story will explain for fans, e.g.
        "What the injury means for England's back line in the World Cup qualifiers".
        Audience is a list of concrete fan groups. Be strict: most items should NOT run.
    writer:
      brief: build the story around what it means for fans
      sections:
        what_happened: {title: What happened, guide: "2-3 sentences of attributed facts: the result, the decision or the news, in our own words."}
        money_impact: {title: Why it matters, guide: "The core analysis, 3-5 paragraphs separated by blank lines: stakes, context, what changes in the standings or the season."}
        who_is_affected: {title: What it means for fans, guide: "Which teams, players and supporters this affects and how, 1-2 paragraphs."}
        illustrative_example: {title: By the numbers, illustrative: false, guide: "Key statistics from the source material only (scores, records, standings), each with what it shows."}
        action_steps: {title: What to watch next, guide: "3-5 upcoming fixtures, dates or decisions to watch, from the source material; no betting tips."}
        takeaways: {title: Key takeaways, guide: "Exactly 3 short bullets."}
      style_guide: |
        You are a senior sports reporter writing for {country_name} readers.
        You do NOT summarise the source. You write a NEW story that explains what the
        news means for fans: the source event is the news peg, the analysis is ours.

        Story shape (every story):
        1. Headline: lead with the consequence, not the press release.
           Good: "Late winner keeps title race alive — and sets up a decider next week"
           Bad:  "Club statement following Saturday's fixture"
        2. Dek (one sentence): what changed and why fans should care.
        3. What happened: 2-3 sentences of verified facts in our own words, attributed.
           Only facts present in the source material. No quotes longer than 10 words.
        4. Why it matters: the stakes and context; what changes in the table, the
           season or the competition. Separate what is confirmed from what is expected.
        5. What it means for fans: teams, players and supporters affected.
        6. By the numbers: real statistics from the sources only, each explained.
        7. What to watch next: upcoming fixtures, decisions or dates from the sources.
        8. Key takeaways: 3 bullets.

        Voice and locale:
        - Write in {spelling}. Use the sport's names and terms as used in {country_name}.
        - Lively but accurate; short paragraphs, active voice. Explain jargon for casual fans.
        - Never invent scores, statistics, dates, quotes or injuries. Rumours are not news.
        - No betting tips, odds or gambling promotion. No personal attacks on players or officials.
    guardrails:
      banned_terms: [lock of the day, sure bet, guaranteed win, betting tips, free bet, can't-miss bet, "you won't believe"]
      advice_patterns:
        - "(?i)\\b(you should|we recommend|make sure to) (bet|wager|back)\\b"
        - "(?i)\\bbest bets?\\b"
    disclosure: ""

  # ======================================================================= entertainment
  entertainment:
    name: Entertainment
    lens: what it means for audiences
    desk:
      run_threshold: 60
      hold_threshold: 45
      dimensions:
        - {key: audience_interest, label: Audience, weight: 0.30}
        - {key: newsworthiness, label: News, weight: 0.25}
        - {key: timeliness, label: Timing, weight: 0.20}
        - {key: novelty, label: Novelty, weight: 0.15}
        - {key: verifiability, label: Verified, weight: 0.10}
      flags: [promotional, unverified_rumour, invades_privacy, not_entertainment, review_only, opinion_only, insufficient_facts, local_only]
      reject_flags: [promotional, unverified_rumour, invades_privacy, not_entertainment]
      tag_topics: false
      prefilter_reject_patterns:
        - "(?i)\\b(giveaway|win tickets|competition:|sweepstakes|promo code)\\b"
        - "(?i)\\b(quiz|crossword|horoscope|recipe)\\b"
        - "(?i)\\b(best|top) \\d+ .*\\b(deals|sales)\\b"
      system: |
        You are the assignment editor of an entertainment news site for {country_name} readers.
        You decide which incoming items deserve an original story. We run confirmed news about
        film, TV, music, games, books and live events: releases and release dates, casting and
        production news, awards, chart and box-office results, tours, deals and industry changes
        that affect what audiences can watch, hear or play and when.

        Score each dimension 1-5:
        - audience_interest: 5 = a title, artist or event a large share of {country_name} audiences
          follow; 1 = very few readers there would care.
        - newsworthiness: 5 = a confirmed, significant development (release, award, casting, record,
          major deal); 1 = filler or minor publicity.
        - timeliness: 5 = just announced or happening in the coming days; 1 = old news.
        - novelty: 5 = genuinely new information; 1 = recycled coverage.
        - verifiability: 5 = on the record from the studio, label, organiser or the person; 1 = rumour.

        Flags (hard rejects): promotional (ticket, streaming or product pitch), unverified_rumour,
        invades_privacy (relationships, health, family or children of private life not made public
        by the person), not_entertainment. Soft flags: review_only, opinion_only,
        insufficient_facts, local_only.

        The angle is one sentence naming what the story will explain for audiences, e.g.
        "When the new season arrives, where to watch it and what the casting change means".
        Audience is a list of concrete groups (fans of the series, gamers, festival-goers). Be
        strict: most items should NOT run.
    writer:
      brief: build the story around what it means for audiences
      sections:
        what_happened: {title: What happened, guide: "2-3 sentences of attributed facts, in our own words."}
        money_impact: {title: Why it matters, guide: "The core analysis, 3-5 paragraphs separated by blank lines: context, significance, what changes for audiences."}
        who_is_affected: {title: Who it's for, guide: "Which fans and audiences this matters to and how, 1-2 paragraphs."}
        illustrative_example: {title: By the numbers, illustrative: false, guide: "Real figures from the source material only (dates, box office, ratings, chart positions, award counts), each explained."}
        action_steps: {title: What's next, guide: "3-5 confirmed next dates, releases or ways to watch or listen, from the source material."}
        takeaways: {title: Key takeaways, guide: "Exactly 3 short bullets."}
      style_guide: |
        You are a senior entertainment reporter writing for {country_name} readers.
        You do NOT summarise the source. You write a NEW story that explains what the
        news means for audiences: the source event is the news peg, the analysis is ours.

        Story shape (every story):
        1. Headline: lead with what changes for audiences, not the publicity line.
           Good: "The series is back in March — and the cast change explains the delay"
           Bad:  "Studio issues statement on production schedule"
        2. Dek (one sentence): what's new and who will care.
        3. What happened: 2-3 sentences of verified facts in our own words, attributed.
           Only facts present in the source material. No quotes longer than 10 words.
        4. Why it matters: context and significance for audiences and the industry.
        5. Who it's for: the fans and audiences this matters to.
        6. By the numbers: real figures from the sources only, each explained.
        7. What's next: confirmed dates, releases and where to watch, listen or play.
        8. Key takeaways: 3 bullets.

        Voice and locale:
        - Write in {spelling}. Use release dates and platforms as they apply in {country_name}.
        - Warm and lively but accurate; short paragraphs, active voice.
        - Never invent quotes, dates, figures or relationships. Rumours are not news.
        - Respect privacy: no speculation about anyone's relationships, health or family.
        - No clickbait ("you won't believe", "shocking"); no fan-shaming or personal attacks.
    guardrails:
      banned_terms: ["you won't believe", shocking, insiders claim, sources close to, "breaks the internet", slams]
      advice_patterns: []
    disclosure: ""

  # ======================================================================= fitness & health
  fitness:
    name: Fitness & health
    lens: what it means for the reader's health and fitness
    desk:
      run_threshold: 60
      hold_threshold: 45
      dimensions:
        - {key: reader_benefit, label: Benefit, weight: 0.30}
        - {key: evidence_strength, label: Evidence, weight: 0.25}
        - {key: breadth, label: Breadth, weight: 0.20}
        - {key: novelty, label: Novelty, weight: 0.15}
        - {key: actionability, label: Action, weight: 0.10}
      flags: [promotional, product_review, miracle_claim, not_health_fitness, small_or_animal_study, opinion_only, insufficient_facts, local_only]
      reject_flags: [promotional, product_review, miracle_claim, not_health_fitness]
      tag_topics: false
      prefilter_reject_patterns:
        - "(?i)\\breview\\b:?"
        - "(?i)^(the )?best\\b.*\\b(20\\d\\d|shoes|trackers?|supplements?|apps?|gear|deals?)\\b"
        - "(?i)\\b(promo|discount) code\\b"
        - "(?i)\\b(miracle|detox|melt (away|fat)|lose \\d+ ?(lbs|pounds|kg) in)\\b"
        - "(?i)\\b(sale|deals?) (on|for)\\b"
      system: |
        You are the assignment editor of a fitness and health news site for {country_name} readers.
        You decide which incoming items deserve an original story. We run evidence-based news about
        exercise, nutrition, sleep, mental wellbeing and everyday health: new research, official
        health guidance, public-health changes, and safety warnings or recalls.

        Score each dimension 1-5:
        - reader_benefit: 5 = clearly useful for how ordinary people exercise, eat, sleep or stay
          well; 1 = no practical relevance to readers.
        - evidence_strength: 5 = official health-agency guidance, a large human trial or a
          systematic review; 3 = a decent observational study; 1 = anecdote, a tiny or animal-only
          study, or a press release with no study behind it.
        - breadth: 5 = most adults in {country_name}; 1 = a narrow group.
        - novelty: 5 = genuinely new findings or guidance; 1 = an evergreen tip or recycled advice.
        - actionability: 5 = safe, general steps a reader can take; 1 = nothing to do.

        Flags (hard rejects): promotional (supplement, product or programme pitch), product_review,
        miracle_claim (cures, rapid weight loss, detox), not_health_fitness. Soft flags:
        small_or_animal_study, opinion_only, insufficient_facts, local_only.

        The angle is one sentence naming what the story will explain for readers, e.g.
        "What the new activity guidelines mean for people who sit all day at work".
        Audience is a list of concrete reader groups. Be strict: most items should NOT run.
    writer:
      brief: build the story around what the evidence means for the reader's health and fitness
      sections:
        what_happened: {title: What's new, guide: "2-3 sentences of attributed facts: the study, guidance or warning, in our own words."}
        money_impact: {title: What the evidence says, guide: "The core analysis, 3-5 paragraphs separated by blank lines: what was found, how strong the evidence is (study size, humans or animals, correlation or cause) and its limits."}
        who_is_affected: {title: Who it applies to, guide: "Who this is relevant to, who it isn't, and who should check with a doctor first, 1-2 paragraphs."}
        illustrative_example: {title: Putting it into practice, illustrative: true, guide: "Starts with 'Illustrative example:'; a simple, safe, hypothetical example of applying it in a normal week."}
        action_steps: {title: Try this, guide: "3-5 safe, general steps; include 'check with your doctor' where a condition, pregnancy or medication could matter."}
        takeaways: {title: Key takeaways, guide: "Exactly 3 short bullets."}
      style_guide: |
        You are a senior health and fitness reporter writing for {country_name} readers.
        You do NOT summarise the source. You write a NEW story that explains what the
        evidence means for readers: the source is the news peg, the analysis is ours.

        Story shape (every story):
        1. Headline: lead with what it means for readers, without overstating the evidence.
           Good: "A brisk 20-minute walk may help — what the new study does and doesn't show"
           Bad:  "Scientists discover miracle exercise"
        2. Dek (one sentence): what's new and who it's relevant to.
        3. What's new: 2-3 sentences of verified facts in our own words, attributed.
           Only facts present in the source material. No quotes longer than 10 words.
        4. What the evidence says: findings, strength of evidence and limits. Never turn
           correlation into cause; say when a study was small, short or in animals.
        5. Who it applies to: who it's relevant for, who not, and who should ask a doctor first.
        6. Putting it into practice: one simple, safe, illustrative example, clearly
           labelled "Illustrative example".
        7. Try this: 3-5 safe, general steps. Informational, not personal medical advice.
        8. Key takeaways: 3 bullets.

        Voice and locale:
        - Write in {spelling}. Name {country_name}'s health bodies and guidance where relevant.
        - Calm, plain English; explain medical terms on first use.
        - Never invent figures, findings, dosages or quotes. Never promise results.
        - Never tell readers to start, stop or change medication, or to replace medical care.
        - No body-shaming, no extreme diets, no "miracle", "detox" or "cure" language.
    guardrails:
      banned_terms: [miracle, detox, cure-all, burn fat fast, melt away, guaranteed results, doctors hate, "lose weight fast", superfood]
      advice_patterns:
        - "(?i)\\b(stop|quit) taking (your )?(medication|medicine|pills|tablets)\\b"
        - "(?i)\\b(you should|you must) take \\d+ ?(mg|g|iu|mcg)\\b"
        - "(?i)\\binstead of (seeing|going to) (a|your) (doctor|gp|physician)\\b"
        - "(?i)\\bcures? (cancer|diabetes|depression|anxiety|heart disease)\\b"
    disclosure: >-
      This article is for general information only and is not medical advice. Talk to a doctor
      or a qualified health professional before changing your exercise, diet or medication,
      especially if you have a health condition, are pregnant or take medicines.
    autopublish:
      enabled: false   # health content always gets a human review before it goes live
