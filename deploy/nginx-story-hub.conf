# Story Hub newsroom desk, HTTPS (installed by deploy/setup_vps.sh; edit the template in the repo)
# Cloudflare (proxied record, SSL mode "Full (strict)") -> nginx -> desk on 127.0.0.1:__PORT__
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    # Let's Encrypt certificate (renewed automatically by certbot), or a Cloudflare origin certificate
    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # renewals can also be validated over HTTPS
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        # only Cloudflare may connect, so nobody can bypass Cloudflare Access or fake the visitor address
        include snippets/story-hub-cloudflare-only.conf;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }
}
