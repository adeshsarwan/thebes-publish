# Story Hub newsroom desk (installed by deploy/setup_vps.sh; edit the template in the repo, not this copy)
# Cloudflare (proxied record, SSL mode "Full (strict)") -> nginx -> desk on 127.0.0.1:__PORT__

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    include snippets/story-hub-cloudflare-only.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    # Cloudflare origin certificate for __DOMAIN__ (SSL/TLS > Origin Server in the Cloudflare dashboard)
    ssl_certificate     __CERT_DIR__/origin.pem;
    ssl_certificate_key __CERT_DIR__/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # only Cloudflare may connect, so nobody can bypass Cloudflare Access or fake the visitor address
    include snippets/story-hub-cloudflare-only.conf;

    client_max_body_size 4m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
    }
}
