# Story Hub newsroom desk, port 80 (installed by deploy/setup_vps.sh; edit the template in the repo)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt validation files (open to everyone: they are only random tokens)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        include snippets/story-hub-cloudflare-only.conf;
        return 301 https://$host$request_uri;
    }
}
